name: WANWAN DEPLOY 02 full import regression
on:
  push:
    branches: [wanwan-deploy-02-import-regression, wanwan-deploy-02-integration]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock dexie@4.4.3 playwright@1.56.1
      - name: Check all JavaScript
        run: find js -name '*.js' -print0 | xargs -0 -n 1 node --check
      - run: node .github/tests/import-atomicity.mjs
      - run: node .github/tests/import-multitab.mjs
      - run: node .github/tests/import-regression.mjs
      - run: node .github/tests/import-crash.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanwan-deploy-02-regression-evidence
          path: wanwan-*-results.json
