name: Wanwan TWA compile probe
on:
  push:
    branches: [wanwan-deploy-01-android-ci]
permissions:
  contents: read
jobs:
  unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Resolve Android SDK and build unsigned APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          gradle -p android --no-daemon :app:assembleRelease -PwanwanOrigin=https://molly-wanwan.netlify.app
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "^(package:|application-label:)";
      - uses: actions/upload-artifact@v4
        with:
          name: wanwan-twa-molly-wanwan-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk*
  import-atomicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock dexie@4.4.3 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node .github/tests/import-atomicity.mjs
