name: Wanwan TWA compile probe
on:
  push:
    branches: [wanwan-deploy-01-android-ci]
permissions:
  contents: read
jobs:
  unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Resolve Android SDK and build unsigned APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          gradle -p android --no-daemon :app:assembleRelease -PwanwanOrigin=https://wanwan-build-probe.invalid
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wanwan-twa-compile-probe-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk*
